# XcodeGen spec for the iOS shell. iosApp.xcodeproj is generated, not checked in:
#
#   brew install xcodegen   # once
#   cd iosApp && xcodegen generate
#
# The pre-build script phase builds the shared KMP framework (Gobley statically
# links the Rust staticlib into it) and copies it where Xcode expects it.
#
# Info.plist mechanism (U18): GENERATE_INFOPLIST_FILE stays YES and the simple
# keys stay INFOPLIST_KEY_* build settings, but UIAppFonts has no
# INFOPLIST_KEY_* form, so the `info:` block below writes a small
# iosApp/Info.plist at `xcodegen generate` time (also generated, not checked
# in) and sets INFOPLIST_FILE. Xcode merges that file into the generated
# plist, so both mechanisms compose.
name: iosApp
options:
  bundleIdPrefix: zinqq
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zinqq.ios
        # iPhone-only. The 16 screens are phone-designed (PWA parity), and
        # declaring iPad support drags in App Store requirements the app
        # doesn't meet (152x152 iPad icon, all-four multitasking orientations
        # — upload validation errors 90023/90474).
        TARGETED_DEVICE_FAMILY: 1
        # Signing (R2/KTD2): automatic signing with the Team ID committed here,
        # because the .xcodeproj is regenerated and Xcode-clicked settings are
        # wiped. CI is unaffected: it builds with CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2LD486V4AU
        # Version source of truth (R4/KTD3). The generated Info.plist derives
        # CFBundleShortVersionString/CFBundleVersion from these; bump
        # CURRENT_PROJECT_VERSION before every TestFlight upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zinqq
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Network selection (U7, KTD-1/KTD-4): build-time, never runtime.
        # Debug targets Mutinynet and installs under its own bundle id so the
        # test wallet sits beside the real one rather than replacing it —
        # the iOS half of Android's `.debug` application id suffix.
        Debug:
          WALLET_NETWORK: mutinynet
          PRODUCT_BUNDLE_IDENTIFIER: zinqq.ios.debug
        # Release — and therefore TestFlight — is mainnet with no override
        # path, so no build invocation can ship a test network.
        Release:
          WALLET_NETWORK: mainnet
    info:
      path: iosApp/Info.plist
      properties:
        # Export compliance (R5/KTD4): the wallet's encryption is standard,
        # published algorithms only (ChaCha20-Poly1305 for VSS blobs, LDK
        # protocol crypto, TLS) — the exempt self-classification under the
        # EAR mass-market provisions, which this key encodes as `false`
        # ("uses no NON-exempt encryption"). `true` requires filed export
        # compliance documentation and a compliance code in the plist; the
        # first upload was rejected without them (validation error 90592).
        ITSAppUsesNonExemptEncryption: false
        # Scan screen (U20, R13): the camera exists solely to read payment
        # QR codes; iOS shows this string on the permission prompt.
        NSCameraUsageDescription: >-
          Zinqq uses the camera to scan payment QR codes.
        # Surfaces the per-configuration WALLET_NETWORK setting above to Swift
        # (U7). An Info.plist key rather than a generated constant: XcodeGen
        # regenerates the project, so a checked-in constant would drift, and
        # the plist already carries the other build-time facts.
        WalletNetwork: $(WALLET_NETWORK)
        # Bundled OFL fonts matching the PWA's self-hosted set (KTD-11, R12):
        # Inter 400-700 (sans) + Space Grotesk 500-700 (display). The TTFs live
        # in iosApp/Fonts/ and are copied flat into the bundle as resources.
        UIAppFonts:
          - inter_400.ttf
          - inter_500.ttf
          - inter_600.ttf
          - inter_700.ttf
          - space_grotesk_500.ttf
          - space_grotesk_600.ttf
          - space_grotesk_700.ttf
    preBuildScripts:
      - name: Build Shared KMP Framework
        script: |
          cd "$SRCROOT/.."

          # Java resolution before the wrapper runs. Xcode's build-phase shell
          # does not inherit an interactive shell's Java setup, and the Gradle
          # *wrapper* must find a `java` executable before Gradle reads any
          # properties — so `org.gradle.java.home` cannot rescue a machine
          # where java is undiscoverable. CI never sees this (actions/setup-java
          # injects JAVA_HOME); a GUI-launched archive on a developer Mac can.
          if [ -n "$JAVA_HOME" ] && [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "warning: JAVA_HOME ($JAVA_HOME) has no bin/java; ignoring it."
            unset JAVA_HOME
          fi
          # `java -version`, not `command -v java`: macOS ships a /usr/bin/java
          # stub that exists on every Mac and only reports "Unable to locate a
          # Java Runtime" when run, so presence on PATH proves nothing.
          if [ -z "$JAVA_HOME" ] && ! java -version > /dev/null 2>&1; then
            JAVA_HOME=$(/usr/libexec/java_home -v 21+ 2>/dev/null) || {
              echo "error: No JDK 21+ found. Building the shared KMP framework needs a java the Gradle wrapper can resolve, and this build shell has neither JAVA_HOME nor java on PATH. See the Java note in docs/runbooks/testflight-upload.md."
              exit 1
            }
            export JAVA_HOME
          fi

          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

  # XCTest unit target (U18): token mode resolution, Route backTo map, and
  # reducer/format parity consumed through the shared framework. Hosted in the
  # app so `import Shared` (statically linked into the app binary) resolves
  # via BUNDLE_LOADER; the test bundle itself does NOT link Shared again.
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zinqq.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iosApp.app/iosApp
        BUNDLE_LOADER: $(TEST_HOST)
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
