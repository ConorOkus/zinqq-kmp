name: CI

# The gates here are the ones that caught real defects during the spike's first
# device runs: four of the eight bugs recorded in
# docs/solutions/best-practices/kmp-rust-ffi-build-early-on-every-target.md were
# only reachable by building for a real target, so the platform jobs are the
# point of this workflow, not decoration around `cargo test`.
#
# The two live-network tests (live_megalith_get_info, live_megalith_receive_jit)
# are #[ignore]d and therefore skipped here on purpose: they talk to mainnet
# Megalith, and a CI job is not a place to depend on a third party's LSP.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Matches shared/build.gradle.kts and androidApp/build.gradle.kts. NDK r28+ is
  # what makes packaged .so files 16 KB-aligned by default (Android 15+).
  NDK_VERSION: 28.1.13356709

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      # Excludes the #[ignore]d live-network tests by default.
      - name: Test
        working-directory: rust
        run: cargo test

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # JDK 21: JDK 26 aborts the Android Gradle Plugin with a bare
          # "* What went wrong: 26.0.1" and no further explanation.
          java-version: '21'
          distribution: temurin

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -eu
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          # No `pipefail` here on purpose: sdkmanager exits before `yes` is done
          # writing, so `yes` takes SIGPIPE and the pipeline reports failure even
          # though the licences were accepted.
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      # Boots the real LDK node through the Gobley-generated bindings, which is
      # what surfaced the Throwable.message collision and the Linux
      # cross-compile demand.
      - name: Bindings smoke test
        run: ./gradlew :shared:jvmTest --stacktrace

      # Reducer/presentation/logic tests for the 16-screen shell (U13-U17).
      - name: Android unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # Android 15+ requires 16 KB-aligned LOAD segments. NDK r28 provides this
      # by default, so this gate catches an accidental NDK downgrade.
      - name: Verify 16 KB page alignment
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -o -q "$apk" 'lib/*' -d "$RUNNER_TEMP/apk"
          readelf=$(find "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt" \
            -name llvm-readelf | head -1)
          status=0
          while IFS= read -r so; do
            echo "== $so"
            aligns=$("$readelf" -l "$so" | awk '$1 == "LOAD" { print $NF }')
            if [ -z "$aligns" ]; then
              echo "  no LOAD segments found"; status=1; continue
            fi
            while IFS= read -r align; do
              if [ "$align" != "0x4000" ]; then
                echo "  NOT 16 KB aligned: $align"; status=1
              else
                echo "  ok: $align"
              fi
            done <<< "$aligns"
          done < <(find "$RUNNER_TEMP/apk/lib" -name '*.so')
          exit "$status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # Compile-only guard for the TestFlight archive chain (R8/KTD5 in
  # docs/plans/2026-07-28-001-feat-testflight-distribution-plan.md): the manual
  # upload path archives a Release device build, a toolchain path nothing else
  # exercises. This job keeps the Rust aarch64-apple-ios staticlib, the Release
  # Kotlin/Native framework, and the unsigned app compile from silently rotting
  # between uploads. `build` (not `archive`) on purpose: archive triggers
  # provisioning validation an unsigned CI job cannot satisfy. No secrets, no
  # upload — signing stays manual per the runbook.
  ios-release-device:
    name: iOS Release device (unsigned guard)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Rust iOS device target
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Distinct from the simulator job's `ios` key: the Release/device
          # cargo target dir would otherwise evict or be evicted by it.
          key: ios-release

      - uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # First half of the archive chain: Rust aarch64-apple-ios staticlib
      # (release profile) statically linked into the Release Kotlin/Native
      # framework.
      - name: Build Release device framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # Second half: the unsigned Release app compile against a generic device
      # destination — the same compile an Xcode archive performs, minus signing.
      - name: Build unsigned Release device app
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ios

      - uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Cross-compiles the Rust core to aarch64-apple-ios-sim and statically
      # links it into the Kotlin/Native framework. This is the gate that caught
      # Dispatchers.IO being unavailable in commonMain on Kotlin/Native.
      - name: Build shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # Builds the SwiftUI shell against the generated framework AND runs the
      # XCTest suite (U18-U22 logic/presentation tests), which is what caught
      # Option<u64> exporting as a nullable KotlinULong?.
      # ARCHS=arm64 is load-bearing: the KMP module declares iosArm64 and
      # iosSimulatorArm64 only, so the framework has no x86_64 slice. Without
      # this, a generic simulator destination also builds x86_64 and the link
      # fails with "symbol(s) not found for architecture x86_64".
      - name: Build and test on simulator
        working-directory: iosApp
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+' | head -1)
          echo "Using simulator: $device"
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build/dd \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
